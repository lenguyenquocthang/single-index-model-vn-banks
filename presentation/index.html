<style>
@property --bg{syntax:'<color>';inherits:true;initial-value:#f6f1e6}
@property --paper{syntax:'<color>';inherits:true;initial-value:#0f1a2b}
@property --a{syntax:'<color>';inherits:true;initial-value:#f2b84b}
@property --b{syntax:'<color>';inherits:true;initial-value:#35c4b0}
@property --g{syntax:'<color>';inherits:true;initial-value:#ff7a6b}
:root{--ink:#14212b;--mut:#5d6f7a;--line:#d6dcd8;--w:#fff;--sub:#33454f;--mx:#14212b;--ok:#1d9f7a;--bad:#d4493f;--card:rgba(255,255,255,.93);
 --ad:color-mix(in srgb,var(--a) 55%,var(--mx));--bd:color-mix(in srgb,var(--b) 55%,var(--mx));--gd:color-mix(in srgb,var(--g) 60%,var(--mx));
 --ease:cubic-bezier(.22,.8,.2,1);--hh:72px;--sl:0px;--sr:0px;--st:0px;--sb:0px;--rad:0px;--vl:0px;--vr:0px;
 transition:--bg 1.2s ease,--paper 1.2s ease,--a 1.2s ease,--b 1.2s ease,--g 1.2s ease}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Segoe UI",Inter,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:"NotoSerifVN",Georgia,"Times New Roman",serif;font-weight:400}
.mono,.k,.eyebrow,.cue,.stats span,.au,.nav,#fig,.ctl,.hcap{font-family:Consolas,Menlo,"DejaVu Sans Mono",monospace}
a{color:var(--bd)}
.top{position:fixed;inset:0 0 auto 0;z-index:40;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .row{height:46px;display:flex;align-items:center;gap:10px;padding:0 16px}
.brand{font:400 16px "NotoSerifVN",Georgia,serif;white-space:nowrap}
#pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
.pill{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 12px;font:12.5px inherit;cursor:pointer;white-space:nowrap;transition:background .5s,color .5s,border-color .5s}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#lg span{opacity:.45;padding:0 3px}#lg span.on{opacity:1;font-weight:700}
#bar{position:fixed;top:46px;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--a),var(--b),var(--g));z-index:41;transition:width .8s var(--ease)}
/* hero: chữ bên trái, bảng tối vẽ 12 đường giá bên phải */
.hero{position:relative;min-height:100vh;overflow:hidden;padding:calc(var(--hh) + 26px) max(22px,4vw) 36px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:3vw;align-items:center;background:radial-gradient(900px 520px at 12% 20%,color-mix(in srgb,var(--a) 22%,transparent),transparent 70%),var(--bg)}
.hl{position:relative;z-index:2}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gd);display:flex;gap:14px;align-items:center}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.hero h1{font-size:clamp(30px,3.9vw,54px);line-height:1.1;margin:16px 0 14px;letter-spacing:-.015em;text-wrap:balance}
.hero .sub{font-size:clamp(15px,1.25vw,17.5px);margin:0 0 22px;color:var(--sub);max-width:560px}
.stats{display:flex;gap:30px;flex-wrap:wrap}

.step[data-m=bar]{align-items:flex-end;padding-bottom:2.4vh}.step[data-m=bar] .q{display:none}.step[data-m=bar] .tx p{font-size:14.5px;line-height:1.55;margin-bottom:6px}.step[data-m=bar] .sum{margin:6px 0 2px;padding:7px 12px;font-size:13.5px}

st(0,'shock','full','r',P('Tính cấp thiết','Why it matters'),P('Điều gì làm việc nắm giữ cổ phiếu trở nên rủi ro hơn?','What made holding equities riskier?'),P('Bốn năm, ba cú sốc, một chỉ số','Four years, three shocks, one index'),
 P('<p>Thị trường tài chính toàn cầu liên tục rung lắc: đại dịch Covid-19, cuộc chiến thương mại Mỹ – Trung, xung đột Nga – Ukraine. Mỗi cú sốc truyền vào thị trường Việt Nam theo một đường riêng, nên đầu tư cổ phiếu trở nên rủi ro hơn nếu thiếu cách đo lường và giảm thiểu rủi ro.</p><p>Đường bên cạnh là VN30 thật của đề tài: từ 887 điểm đầu 2020 xuống 611 điểm (31/03/2020), lên đỉnh 1.572 điểm (25/11/2021), rồi về 905 điểm (15/11/2022), sụt tối đa 42,5% từ đỉnh.</p>','<p>Global financial markets kept shaking: the Covid-19 pandemic, the US–China trade war, the Russia–Ukraine conflict. Each shock reached Vietnam through its own channel, so holding equities became riskier without a way to measure and contain risk.</p><p>The line beside this text is the real VN30 of the study: from 887 points in early 2020 down to 611 (31 Mar 2020), up to a peak of 1,572 (25 Nov 2021), then back to 905 (15 Nov 2022), a maximum drawdown of 42.5%.</p>'),
 P('Cú sốc nào cũng để lại một đoạn đường dốc; câu hỏi của đề tài là phần dốc đó thuộc về thị trường hay thuộc về riêng từng cổ phiếu.','Every shock leaves a steep stretch; the question is whether that slope belongs to the market or to the stock itself.'),null,[13,12,11,8]);
st(0,'models','sl',null,P('Chọn mô hình','Choosing a model'),P('Vì sao lại là mô hình chỉ số đơn?','Why the single index model?'),P('Ngân hàng cần đo rủi ro, và cần một mô hình dùng được','Banks need to measure risk, and need a usable model'),
 P('<p>Ở các thị trường phát triển, nhà đầu tư phân tích kỹ rủi ro và tỷ suất sinh lời trước khi mua bất kỳ tài sản nào. Ngân hàng thương mại, vừa cho vay vừa đầu tư cổ phiếu, thường đối mặt rủi ro lớn nhất, nên họ dùng nhiều mô hình: SIM, CAPM, CAPM đa biến, APT…</p><p>Mỗi mô hình đều có điểm yếu riêng. SIM vẫn được ưa chuộng nhờ đơn giản và dễ ứng dụng: chỉ cần một chuỗi chỉ số thị trường. Vì vậy áp dụng SIM để đo rủi ro cổ phiếu ngân hàng vốn hóa lớn ở Việt Nam là cần thiết, giúp nhà đầu tư và ngân hàng đạt lợi nhuận mong muốn mà vẫn giảm rủi ro phát sinh.</p>','<p>In developed markets, investors analyse risk and return carefully before buying any asset. Commercial banks, which both lend and hold equities, usually face the largest risk, so they use many models: SIM, CAPM, multi-factor CAPM, APT…</p><p>Each model has its own weaknesses. SIM stays popular because it is simple and easy to apply: it only needs one market-index series. Applying SIM to large-cap bank stocks in Vietnam is therefore worthwhile, helping investors and banks reach the return they want while limiting the risk that arises.</p>'),
 P('Đổi độ phức tạp lấy tính dùng được: SIM là điểm cân bằng cho một nghiên cứu chỉ có một chuỗi chỉ số.','Trade complexity for usability: SIM is the sweet spot for a study with a single index series.'),null,[1,5,20]);
st(0,'scope','full','l',P('Mục đích và phạm vi','Aims and scope'),P('Đề tài đo cái gì, trên đối tượng nào?','What does it measure, on what?'),P('Hai mục đích, mười hai cổ phiếu, một chỉ số','Two aims, twelve stocks, one index'),
 P('<p><b>Mục đích.</b> Thứ nhất, hệ thống hóa lý thuyết mô hình chỉ số đơn: nguyên lý, cấu trúc, giả định và phương pháp ước lượng. Thứ hai, dựa trên đó áp dụng SIM để đo rủi ro cổ phiếu ngân hàng TMCP vốn hóa lớn, từ đó cho thấy mô hình hỗ trợ đánh giá và quản lý rủi ro như thế nào trong bối cảnh Việt Nam.</p><p><b>Đối tượng và phạm vi.</b> Đối tượng là đo lường rủi ro đầu tư chứng khoán, gồm SIM và các phương pháp ước lượng. Dữ liệu là giá cổ phiếu 12 ngân hàng thuộc nhóm VN30, theo ngày, từ đầu 2020 đến tháng 7/2024.</p>','<p><b>Aims.</b> First, to systematise the theory of the single index model: principles, structure, assumptions and estimation methods. Second, to apply SIM to measure the risk of large-cap joint-stock bank stocks, showing how the model supports risk assessment and management in Vietnam.</p><p><b>Object and scope.</b> The object is risk measurement in equity investing, covering SIM and its estimation methods. The data are daily prices of 12 banks in the VN30 group, from early 2020 to July 2024.</p>'),
 P('Một chỉ số thị trường (VN30), mười hai ngân hàng, hơn một nghìn phiên.','One market index (VN30), twelve banks, over a thousand sessions.'),null,[]);
st(0,'method','bar',null,P('Phương pháp','Methods'),P('Công cụ nào sẽ được dùng?','Which tools are used?'),P('Từ thống kê mô tả đến GMM','From descriptive statistics to GMM'),
 P('<p>Đề tài dùng thống kê mô tả, phân tích tổng hợp, ước lượng bình phương tối thiểu thông thường (OLS) và phương pháp mô-men tổng quát (GMM). Trước khi ước lượng, chuỗi lợi suất được kiểm định tính dừng (ADF) và tính chuẩn (Jarque–Bera); kết quả kiểm định quyết định ta tin được sai số chuẩn của OLS đến đâu, và khi nào cần sai số chuẩn bền vững hơn.</p><p><b>Ý nghĩa.</b> Kết quả cho nhà đầu tư các hàm ý và khuyến nghị để cải thiện chiến lược đầu tư và quản lý rủi ro trên thị trường chứng khoán Việt Nam.</p>','<p>The study uses descriptive statistics, synthesis, ordinary least squares (OLS) and the generalised method of moments (GMM). Before estimating, return series are tested for stationarity (ADF) and normality (Jarque–Bera); the results decide how far OLS standard errors can be trusted and when sturdier standard errors are needed.</p><p><b>Significance.</b> The results give investors implications and recommendations to improve investment strategy and risk management in the Vietnamese stock market.</p>'),
 P('Mỗi kiểm định trả lời một câu hỏi về dữ liệu trước khi mô hình được phép nói điều gì về rủi ro.','Each test answers a question about the data before the model may say anything about risk.'),null,[21,22,23]);
st(0,'struct','sr',null,P('Kết cấu','Structure'),P('Bài đi theo thứ tự nào?','In what order does it unfold?'),P('Ba chương giữa phần mở đầu và kết luận','Three chapters between introduction and conclusion'),
 P('<p><b>Chương 1</b> trình bày lý thuyết đo lường lợi tức và rủi ro, rồi giới thiệu SIM và các cách ước lượng. <b>Chương 2</b> khái quát thị trường chứng khoán Việt Nam, thực trạng ngành ngân hàng TMCP trên thị trường, biến động giá cổ phiếu nhóm VN30 và các rủi ro tác động đến giá. <b>Chương 3</b> trình bày dữ liệu, xây dựng và ước lượng mô hình, từ đó đưa ra kết quả, hàm ý và khuyến cáo.</p>','<p><b>Chapter 1</b> sets out the theory of measuring return and risk, then introduces SIM and its estimators. <b>Chapter 2</b> outlines the Vietnamese stock market, the joint-stock banking sector on it, price movements of VN30 bank stocks and the risks affecting prices. <b>Chapter 3</b> presents the data, builds and estimates the model, and draws results, implications and recommendations.</p>'),
 P('Lý thuyết trước, bối cảnh kế tiếp, đo lường sau cùng.','Theory first, context next, measurement last.'),null,[]);
/* ===== CHƯƠNG 1 ===== */
st(1,'er','full','l',P('Lợi tức kỳ vọng','Expected return'),P('Một khoản đầu tư “sinh lời” bao nhiêu khi chưa biết kết quả?','How much does an investment “earn” before the outcome is known?'),P('Lợi tức và lợi tức kỳ vọng','Return and expected return'),
 P('<p>Lợi tức là lợi ích kinh tế thu được từ một khoản đầu tư sau khi trừ chi phí, đo bằng cách so sánh tổng giá trị thu về với vốn bỏ ra. Sau khi đầu tư kết thúc, tính lợi tức thực tế rất dễ; điều khó là dự đoán trước khi mua.</p><p>Markowitz đưa khái niệm kỳ vọng của lý thuyết xác suất vào tài chính: tỷ suất lợi nhuận kỳ vọng là trung bình có trọng số của các kịch bản, trọng số là xác suất. Trên thực tế nhiều nhà đầu tư thay bằng trung bình các kỳ quá khứ. Kéo các thanh trượt để thấy kỳ vọng dịch chuyển.</p>','<p>Return is the economic benefit earned from an investment net of costs, measured by comparing total value received with capital invested. Computing the realised return afterwards is easy; predicting it before buying is hard.</p><p>Markowitz brought the expectation of probability theory into finance: expected return is a probability-weighted average of scenarios. In practice many investors substitute the average of past periods. Drag the sliders to watch the expectation move.</p>'),
 P('Kỳ vọng chỉ là một con số tóm tắt các kịch bản; nó không hứa kịch bản nào sẽ xảy ra.','The expectation is one number summarising scenarios; it promises none of them.'),
 String.raw`$$E(r)=\sum_{i=1}^{n}R_i\,p_i;\qquad E(r)=\bar R=\frac1n\sum_{i=1}^{n}R_i$$`,[19,5]);
st(1,'risk','sr',null,P('Rủi ro','Risk'),P('Rủi ro là gì, và loại bỏ được bao nhiêu?','What is risk, and how much can be removed?'),P('Rủi ro hệ thống và phi hệ thống','Systematic and unsystematic risk'),
 P('<p>Rủi ro là khả năng xảy ra những sự kiện không lường trước, gây ảnh hưởng tiêu cực đến kết quả đầu tư: biến động thị trường, thay đổi chính sách, rủi ro tín dụng, biến cố bất ngờ. Lý thuyết đầu tư hiện đại chia thành hai loại.</p><p><b>Rủi ro hệ thống</b> ảnh hưởng toàn bộ thị trường hay nền kinh tế (khủng hoảng, suy thoái). <b>Rủi ro phi hệ thống</b> chỉ ảnh hưởng một công ty, ngành hay tài sản do yếu tố nội bộ. Hình bên dùng 12 ngân hàng thật: gộp càng nhiều cổ phiếu, độ lệch chuẩn danh mục càng giảm, nhưng dừng ở một sàn mà đa dạng hóa không xuyên qua được.</p>','<p>Risk is the possibility of unforeseen events that hurt investment outcomes: market swings, policy changes, credit risk, shocks. Modern investment theory splits it into two kinds.</p><p><b>Systematic risk</b> hits the whole market or economy (crises, recessions). <b>Unsystematic risk</b> hits one firm, sector or asset through internal factors. The chart uses the 12 real banks: the more stocks pooled, the lower the portfolio standard deviation, but it stops at a floor that diversification cannot cross.</p>'),
 P('Đa dạng hóa xoá được rủi ro riêng, không xoá được rủi ro chung.','Diversification removes idiosyncratic risk, not common risk.'),null,[19,5]);
st(1,'dist','full','r',P('Đo rủi ro một cổ phiếu','Risk of one stock'),P('Đo rủi ro của một cổ phiếu bằng cách nào?','How is the risk of a single stock measured?'),P('Độ lệch chuẩn của lợi suất','The standard deviation of returns'),
 P('<p>Với một cổ phiếu, rủi ro được đo bằng độ phân tán của lợi suất quanh giá trị kỳ vọng: phương sai và độ lệch chuẩn. Biểu đồ cho thấy phân phối lợi suất ngày của từng ngân hàng, vạch trắng là kỳ vọng, vùng sáng là ±1 độ lệch chuẩn.</p><p>Chọn VCB rồi chuyển sang STB: cùng một thị trường, nhưng độ rộng của đám lợi suất khác nhau rõ rệt. Đây là con số tổng rủi ro mà SIM sẽ tách đôi ở phần sau.</p>','<p>For one stock, risk is measured by the dispersion of returns around the expected value: variance and standard deviation. The chart shows the distribution of daily returns of each bank, the white mark is the expectation, the shaded band is ±1 standard deviation.</p><p>Pick VCB, then switch to STB: same market, yet the width of the return cloud differs visibly. This is the total risk that SIM will split in two later.</p>'),
 P('Độ lệch chuẩn là thước đo tổng rủi ro; chưa nói được rủi ro đến từ đâu.','Standard deviation measures total risk; it does not say where risk comes from.'),
 String.raw`$$\sigma_i^2=\operatorname{Var}(R_i)=\frac1{n-1}\sum_{t=1}^{n}\left(R_{it}-\bar R_i\right)^2,\qquad \sigma_i=\sqrt{\sigma_i^2}$$`,[19]);
st(1,'cov','sl',null,P('Hiệp phương sai','Covariance'),P('Hai cổ phiếu có cùng đi một hướng không?','Do two stocks move in the same direction?'),P('Hiệp phương sai: chiều của sự đồng hành','Covariance: the direction of co-movement'),
 P('<p>Hiệp phương sai đo mức liên kết giữa hai biến ngẫu nhiên, tức mức biến động đồng hướng của lợi suất hai tài sản. <b>Dương</b>: biến thứ nhất tăng thì biến thứ hai có xu hướng tăng. <b>Âm</b>: đi ngược chiều. <b>Bằng không</b>: không có liên kết rõ ràng về hướng.</p><p>Mỗi chấm là một phiên. Chấm rơi vào góc phần tư trên-phải và dưới-trái đóng góp dương vào hiệp phương sai, hai góc còn lại đóng góp âm. Chọn hai ngân hàng và đếm xem góc nào đông hơn.</p>','<p>Covariance measures the link between two random variables, i.e. the co-movement of two assets’ returns. <b>Positive</b>: when the first rises the second tends to rise. <b>Negative</b>: they move opposite. <b>Zero</b>: no clear directional link.</p><p>Each dot is a session. Dots in the upper-right and lower-left quadrants add positively to covariance, the other two subtract. Pick two banks and see which quadrants are fuller.</p>'),
 P('Dấu của hiệp phương sai cho biết hướng; độ lớn của nó phụ thuộc đơn vị đo.','The sign of covariance gives direction; its size depends on units.'),
 String.raw`$$\operatorname{Cov}(r_1,r_2)=\sum_i p_i\,[r_{1i}-E r_1][r_{2i}-E r_2]\qquad\operatorname{Cov}(r_1,r_2)=\frac1n\sum_{i=1}^{n}(r_{1i}-\bar R_1)(r_{2i}-\bar R_2)$$`,[19]);
st(1,'corr','full','l',P('Tương quan','Correlation'),P('Làm sao so sánh mức đồng hành giữa các cặp?','How can co-movement be compared across pairs?'),P('Hệ số tương quan: chuẩn hóa về −1…+1','Correlation: normalised to −1…+1'),
 P('<p>Vì hiệp phương sai phụ thuộc đơn vị, so sánh giữa các cặp khác thang đo rất khó. Hệ số tương quan chia hiệp phương sai cho tích hai độ lệch chuẩn, đưa về khoảng từ −1 (nghịch tuyệt đối) đến +1 (thuận tuyệt đối). Trong thực tế người ta tính từ dữ liệu lịch sử thay vì kịch bản dự báo.</p><p>Dải bên cạnh đặt cả 66 cặp ngân hàng lên một thước: phần lớn dồn về phía dương, chưa cặp nào gần 1. Chọn cặp để thấy vị trí của nó, và đổi đơn vị để thấy hiệp phương sai đổi còn tương quan thì không.</p>','<p>Because covariance depends on units, comparing pairs on different scales is hard. The correlation coefficient divides covariance by the product of the two standard deviations, mapping it to −1 (perfect inverse) to +1 (perfect direct). In practice it is computed from history rather than forecast scenarios.</p><p>The strip places all 66 bank pairs on one ruler: most sit on the positive side, none near 1. Pick a pair to see its position, and change units to see covariance change while correlation does not.</p>'),
 P('Tương quan là hiệp phương sai đã bỏ đơn vị, nên so sánh được giữa mọi cặp.','Correlation is covariance with the units removed, so every pair is comparable.'),
 String.raw`$$\rho_{12}=\operatorname{Cor}(r_1,r_2)=\frac{\operatorname{Cov}(r_1,r_2)}{\sigma_1\sigma_2},\qquad -1\le\rho_{12}\le 1$$`,[19]);
st(1,'p2','sr',null,P('Danh mục 2 tài sản','Two-asset portfolio'),P('Ghép hai cổ phiếu thì rủi ro thay đổi ra sao?','What happens to risk when two stocks are combined?'),P('Lợi tức kỳ vọng và phương sai của danh mục','Portfolio expected return and variance'),
 P('<p>Lợi tức kỳ vọng của danh mục là trung bình gia quyền của lợi tức kỳ vọng từng tài sản, trọng số là tỷ trọng vốn. Phương sai thì khác: ngoài hai phương sai riêng còn có số hạng chứa hiệp phương sai.</p><p>Kéo tỷ trọng và hệ số tương quan để xem: khi ρ nhỏ hơn 1, độ lệch chuẩn danh mục nằm dưới đường nối thẳng hai độ lệch chuẩn. Phần chênh lệch đó là lợi ích của đa dạng hóa, và nó càng lớn khi hai tài sản càng ít đi cùng nhau.</p>','<p>A portfolio’s expected return is the weighted average of each asset’s expected return, weights being capital shares. Variance is different: besides the two own variances there is a term containing covariance.</p><p>Drag the weight and the correlation to see: when ρ is below 1, portfolio standard deviation lies below the straight line joining the two standard deviations. That gap is the benefit of diversification, larger the less the two assets move together.</p>'),
 P('Rủi ro của danh mục không phải trung bình rủi ro; hiệp phương sai quyết định phần giảm được.','Portfolio risk is not the average of risks; covariance decides how much can be shaved off.'),
 String.raw`$$E(r_p)=\sum_{i=1}^{n}w_iE(r_i)\qquad \sigma_p^2=w_1^2\sigma_1^2+w_2^2\sigma_2^2+2w_1w_2\operatorname{Cov}(r_1,r_2)$$`,[19]);
st(1,'pn','full','r',P('Danh mục n tài sản','n-asset portfolio'),P('Thêm cổ phiếu thì phải ước lượng bao nhiêu tham số?','How many parameters are needed as stocks are added?'),P('n phương sai và n(n−1)/2 hiệp phương sai','n variances and n(n−1)/2 covariances'),
 P('<p>Danh mục thực tế gồm nhiều cổ phiếu. Phương sai danh mục n chứng khoán gồm tổng các số hạng trọng số bình phương nhân phương sai, cộng với tổng mọi cặp i ≠ k của tích hai trọng số và hiệp phương sai.</p><p>Số hiệp phương sai cần ước lượng tăng gần như theo bình phương: 12 ngân hàng đã cần 66 hiệp phương sai và 12 phương sai. Kéo n để xem lưới ma trận lớn dần. Đây chính là chi phí mà mô hình chỉ số đơn sinh ra để cắt giảm.</p>','<p>Real portfolios hold many stocks. The variance of an n-security portfolio is the sum of squared-weight times variance terms, plus the sum over all pairs i ≠ k of the product of two weights and their covariance.</p><p>The number of covariances to estimate grows almost quadratically: 12 banks already need 66 covariances and 12 variances. Drag n to watch the matrix grid grow. This is precisely the cost the single index model was invented to cut.</p>'),
 P('Ma trận hiệp phương sai phình theo bình phương số cổ phiếu, nên cần một cách rút gọn.','The covariance matrix swells with the square of the number of stocks, so a shortcut is needed.'),
 String.raw`$$\sigma_p^2=\sum_{i=1}^{n}w_i^2\sigma_i^2+\sum_{i=1}^{n}\sum_{\substack{k=1\\ k\ne i}}^{n}w_iw_k\operatorname{Cov}(r_i,r_k)$$`,[19]);
st(1,'sim1','sl',null,P('Mô hình chỉ số đơn','Single index model'),P('Có thể thay hàng chục hiệp phương sai bằng một nhân tố chung không?','Can dozens of covariances be replaced by one common factor?'),P('Sharpe 1963: gom về một chỉ số thị trường','Sharpe 1963: collapse onto one market index'),
 P('<p>Mô hình chỉ số đơn do William Sharpe giới thiệu năm 1963, nhằm đơn giản hóa phân tích danh mục và quản lý rủi ro, thay vì dùng mô hình đa chỉ số bằng cách tập trung vào một chỉ số thị trường duy nhất.</p><p>Ý tưởng: thay vì để mọi cặp cổ phiếu liên hệ trực tiếp với nhau, ta cho mỗi cổ phiếu chỉ liên hệ với chỉ số. Hai cổ phiếu vẫn đồng hành, nhưng thông qua chỉ số. Bấm nút để gập lưới 66 đường nối thành 12 nan hoa.</p>','<p>The single index model was introduced by William Sharpe in 1963 to simplify portfolio analysis and risk management, concentrating on one market index instead of a multi-index model.</p><p>The idea: instead of letting every pair of stocks relate directly, let each stock relate only to the index. Two stocks still move together, but through the index. Press the button to fold the 66-edge mesh into 12 spokes.</p>'),
 P('66 cặp được thay bằng 12 mối liên hệ với chỉ số.','66 pairs are replaced by 12 links to the index.'),null,[20]);
st(1,'reg','full','l',P('Phương trình SIM','SIM equation'),P('Mô hình nói gì về lợi suất của một cổ phiếu?','What does the model say about one stock’s return?'),P('Giả thuyết và phương trình hồi quy','Assumptions and the regression equation'),
 P('<p>Lợi tức của mỗi tài sản phụ thuộc tuyến tính vào lợi tức chỉ số thị trường: R<sub>i</sub> = α<sub>i</sub> + β<sub>i</sub>R<sub>m</sub> + ε<sub>i</sub>. α là phần không phụ thuộc thị trường, β đo độ nhạy với thị trường, ε là sai số ngẫu nhiên không giải thích được. Ở bài này chỉ số thị trường là VN30.</p><p>Bốn giả thuyết: (1) quan hệ tuyến tính; (2) E(ε) = 0; (3) ε không tương quan với lợi suất thị trường; (4) các ε của hai cổ phiếu không tương quan với nhau. Đồ thị hiện đường hồi quy của từng ngân hàng cùng các khoảng cách dọc chính là ε.</p>','<p>Each asset’s return depends linearly on the market-index return: R<sub>i</sub> = α<sub>i</sub> + β<sub>i</sub>R<sub>m</sub> + ε<sub>i</sub>. α is the part independent of the market, β measures sensitivity to the market, ε is the unexplained random error. Here the market index is VN30.</p><p>Four assumptions: (1) a linear relation; (2) E(ε) = 0; (3) ε is uncorrelated with the market return; (4) the ε of two stocks are uncorrelated. The plot shows each bank’s regression line; the vertical gaps are ε.</p>'),
 P('Mỗi phiên, lợi suất của ngân hàng = phần theo thị trường + phần riêng.','Each session, a bank’s return = the part following the market + its own part.'),
 String.raw`$$R_i=\alpha_i+\beta_iR_m+\varepsilon_i,\quad E(\varepsilon_i)=0,\quad \operatorname{Cov}(\varepsilon_i,R_m)=0,\quad \operatorname{Cov}(\varepsilon_i,\varepsilon_j)=0\ (i\ne j)$$`,[20]);
st(1,'decomp','sr',null,P('Phân rã rủi ro','Risk decomposition'),P('Rủi ro của cổ phiếu tách thành những phần nào?','What parts does a stock’s risk split into?'),P('Lấy phương sai hai vế','Taking variance of both sides'),
 P('<p>Lấy phương sai hai vế của SIM: Var(R<sub>i</sub>) = β<sub>i</sub>²Var(R<sub>m</sub>) + Var(ε<sub>i</sub>). Tổng rủi ro là σ<sub>i</sub>, rủi ro hệ thống là β<sub>i</sub>σ<sub>m</sub>, rủi ro phi hệ thống là phần còn lại √(σ<sub>i</sub>² − β<sub>i</sub>²σ<sub>m</sub>²).</p><p>Kéo β và độ biến động thị trường để thấy cột rủi ro hệ thống dài ra hay ngắn đi. Tỷ lệ rủi ro hệ thống trên tổng chính là R². Cổ phiếu có β cao hơn 1 khuếch đại thị trường; β dưới 1 làm dịu.</p>','<p>Take the variance of both sides of SIM: Var(R<sub>i</sub>) = β<sub>i</sub>²Var(R<sub>m</sub>) + Var(ε<sub>i</sub>). Total risk is σ<sub>i</sub>, systematic risk is β<sub>i</sub>σ<sub>m</sub>, unsystematic risk is the remainder √(σ<sub>i</sub>² − β<sub>i</sub>²σ<sub>m</sub>²).</p><p>Drag β and market volatility to see the systematic bar grow or shrink. The share of systematic risk in the total is exactly R². A β above 1 amplifies the market; below 1 dampens it.</p>'),
 P('R² là phần trăm rủi ro của cổ phiếu mà thị trường giải thích được.','R² is the share of a stock’s risk the market explains.'),
 String.raw`$$\sigma_i^2=\underbrace{\beta_i^2\sigma_m^2}_{\sigma_{ih}^2}+\underbrace{\sigma_{\varepsilon_i}^2}_{\sigma_{io}^2},\qquad R^2=\frac{\beta_i^2\sigma_m^2}{\sigma_i^2}$$`,[20]);
st(1,'est','full','r',P('Ước lượng OLS và GMM','OLS and GMM'),P('Ước lượng α và β bằng cách nào khi dữ liệu không chuẩn?','How are α and β estimated when data are not normal?'),P('Bình phương tối thiểu và mô-men tổng quát','Least squares and the generalised method of moments'),
 P('<p>OLS chọn α và β làm tổng bình phương sai số nhỏ nhất, với giả định dữ liệu chuẩn, độc lập và đồng nhất. Khi chuỗi không chuẩn, có tự tương quan hay phương sai sai số thay đổi, phương pháp mô-men tổng quát (GMM) được dùng.</p><p>GMM đi từ điều kiện mô-men: kỳ vọng sai số bằng 0 và sai số không tương quan với lợi suất thị trường. Hai điều kiện này cho hai phương trình với hai ẩn α, β. Bản đồ bên cạnh vẽ tiêu chuẩn GMM theo (α, β), điểm tối thiểu trùng với nghiệm OLS; khác biệt thực sự nằm ở sai số chuẩn bền vững (HAC) dùng để suy luận.</p>','<p>OLS picks α and β to minimise the sum of squared errors, assuming normal, independent, homoskedastic data. When the series is non-normal, autocorrelated or heteroskedastic, the generalised method of moments (GMM) is used.</p><p>GMM starts from moment conditions: the error has zero mean and is uncorrelated with the market return. Two conditions give two equations in two unknowns α, β. The map beside plots the GMM criterion over (α, β); its minimum coincides with the OLS solution, and the real difference lies in the robust (HAC) standard errors used for inference.</p>'),
 P('Với hai điều kiện mô-men cho hai ẩn, GMM và OLS cho cùng điểm ước lượng; GMM bổ sung phép suy luận bền vững.','With two moment conditions for two unknowns, GMM and OLS give the same point estimate; GMM adds robust inference.'),
 String.raw`$$E[\varepsilon_i]=0,\ E[\varepsilon_iR_m]=0\ \Rightarrow\ \hat\beta=\frac{\widehat{\operatorname{Cov}}(R_i,R_m)}{\widehat{\operatorname{Var}}(R_m)},\ \ \hat\alpha=\bar R_i-\hat\beta\bar R_m$$`,[23,24]);

/* ===== CHƯƠNG 2 ===== */
st(2,'tl1','bar',null,P('Sự ra đời của TTCK','Birth of the market'),P('Thị trường chứng khoán Việt Nam bắt đầu từ đâu?','Where did the Vietnamese stock market begin?'),P('Từ hai cổ phiếu đến hàng trăm mã niêm yết','From two stocks to hundreds of listings'),
 P('<p>Để công nghiệp hóa – hiện đại hóa, cần nguồn vốn lớn; vì vậy xây dựng TTCK nhằm thu hút vốn trung và dài hạn trong và ngoài nước qua chứng khoán nợ và chứng khoán vốn, đồng thời cổ phần hóa doanh nghiệp nhà nước và tạo môi trường đầu tư minh bạch.</p><p>Ngày 10/07/1998 Chính phủ ban hành Nghị định 48/1998/NĐ-CP và Quyết định 127/1998/QĐ-TTg lập hai Trung tâm Giao dịch Chứng khoán. TP.HCM khai trương phiên đầu ngày 28/07/2000 với hai cổ phiếu REE và SAM; Hà Nội hoạt động từ 08/03/2005 với sáu cổ phiếu. TTGDCK TP.HCM chuyển thành Sở Giao dịch theo Quyết định 599/QĐ-TTg ngày 11/05/2007, khai trương 08/08/2007. Đến tháng 4/2024 có 398 cổ phiếu niêm yết ở HOSE và 321 ở HNX.</p>','<p>Industrialisation and modernisation need large capital, so the stock market was built to draw medium and long-term funds from home and abroad through debt and equity securities, while equitising state enterprises and creating a transparent investment climate.</p><p>On 10 Jul 1998 the Government issued Decree 48/1998/ND-CP and Decision 127/1998/QD-TTg creating two Securities Trading Centers. Ho Chi Minh City held its first session on 28 Jul 2000 with two stocks, REE and SAM; Hanoi started on 8 Mar 2005 with six. The HCMC centre became a Stock Exchange under Decision 599/QD-TTg of 11 May 2007, opening on 8 Aug 2007. By April 2024 there were 398 listed stocks on HOSE and 321 on HNX.</p>'),
 P('Hơn hai thập kỷ, thị trường trở thành kênh dẫn vốn trung và dài hạn quan trọng của nền kinh tế.','Over two decades the market became a key channel of medium and long-term capital.'),null,[7,8,2]);
st(2,'vnidx','full','r',P('Diễn biến 2020–2024','2020–2024 in motion'),P('Mỗi năm thị trường đã đi qua điều gì?','What did the market go through each year?'),P('Từ cú sốc Covid đến nhịp điều chỉnh 2024','From the Covid shock to the 2024 pullback'),
 P('<p><b>2020:</b> Covid-19 gây cú sốc chưa từng có, nhưng kiểm soát dịch tốt và lãi suất thấp kỷ lục dẫn đến làn sóng tài khoản mới gần bằng cả mười năm trước cộng lại. <b>2021:</b> thanh khoản đạt mốc chưa từng có, trung bình trên 21.593 tỷ đồng mỗi phiên (tăng 247,27% so với 2020); VN-Index đạt 1.500,81 điểm ngày 25/11/2021.</p><p><b>2022:</b> tiền tệ thắt chặt toàn cầu để chống lạm phát, tín dụng toàn ngành tăng 14–16%. <b>2023:</b> vốn hóa trên 240 tỷ USD (56,4% GDP), phát hành trái phiếu doanh nghiệp 333.988 tỷ đồng (+37,8%). <b>2024:</b> VN-Index giảm từ 1.261,72 điểm (tháng 5) xuống 1.245,32 (tháng 6), tức khoảng 1,3%; dư nợ tín dụng tăng 14,2% đầu năm. Cột là lợi suất cả năm của VN30 tính từ dữ liệu.</p>','<p><b>2020:</b> Covid-19 delivered an unprecedented shock, but good epidemic control and record-low rates brought a wave of new accounts nearly equal to the previous ten years combined. <b>2021:</b> liquidity hit record levels, averaging over VND 21,593 bn per session (+247.27% on 2020); VN-Index reached 1,500.81 on 25 Nov 2021.</p><p><b>2022:</b> global monetary tightening against inflation, sector credit growth of 14–16%. <b>2023:</b> market capitalisation over USD 240 bn (56.4% of GDP), corporate bond issuance VND 333,988 bn (+37.8%). <b>2024:</b> VN-Index slid from 1,261.72 (May) to 1,245.32 (June), about 1.3%; credit grew 14.2% early in the year. The bars are the VN30 return of each year computed from the data.</p>'),
 P('Một năm bùng nổ, một năm sụp đổ, hai năm hồi phục: cùng một thị trường, bốn chế độ rủi ro.','One boom year, one collapse, two recoveries: one market, four risk regimes.'),null,[12,13,11,8,14]);
st(2,'limits','sl',null,P('Hạn chế của TTCK','Market limitations'),P('Điều gì còn thiếu của thị trường này?','What does this market still lack?'),P('Tám hạn chế của thị trường chứng khoán Việt Nam','Eight limitations of the Vietnamese stock market'),
 P('<p>Thị trường còn nhiều hạn chế: chỉ số biến động không ổn định; chất lượng doanh nghiệp niêm yết chưa cao; hệ thống quản lý chưa hoàn thiện; quy mô còn nhỏ; cấu trúc thị trường chưa hoàn thiện; pháp lý và cơ chế giám sát còn hạn chế; tỷ lệ sở hữu nước ngoài bị giới hạn nên khó thu hút vốn ngoại; thanh khoản chưa cao nên mua bán cổ phiếu khó khăn.</p><p>Di chuột hoặc chạm vào từng cánh của vòng để đọc. Mọi hạn chế này đều dẫn đến cùng một hệ quả: giá cổ phiếu biến động mạnh hơn mức cơ bản của doanh nghiệp.</p>','<p>The market still has many limits: unstable index movements; modest listed-company quality; incomplete management systems; small size; incomplete market structure; limited legal framework and supervision; foreign ownership caps that make it hard to attract foreign capital; and limited liquidity that makes trading stocks difficult.</p><p>Hover or tap each petal of the wheel to read. All of them lead to the same consequence: prices move more than company fundamentals alone would justify.</p>'),
 P('Thị trường nhỏ và chưa sâu thì cú sốc nào cũng lan rộng hơn.','A small, shallow market lets every shock spread further.'),null,[2,8]);
st(2,'taxo','full','l',P('Rủi ro trên TTCK','Market risks'),P('Rủi ro của thị trường chia thành những nhánh nào?','Into which branches does market risk divide?'),P('Rủi ro hệ thống và phi hệ thống tại Việt Nam','Systematic and unsystematic risk in Vietnam'),
 P('<p><b>Hệ thống</b> bắt nguồn từ nhân tố vĩ mô như chiến tranh, lạm phát, sự kiện kinh tế – chính trị. Gồm <i>rủi ro thị trường</i> (cách nhà đầu tư nhìn nhận giá trị cổ phiếu; tâm lý hoảng sợ gây bán tháo dây chuyền như giai đoạn 2001–2003 và từ 2008) và <i>rủi ro lãi suất</i>.</p><p><b>Phi hệ thống</b> phát sinh từ lao động, năng lực quản lý, tranh chấp pháp lý, chính sách điều tiết, và có thể giảm bằng danh mục đa dạng. Gồm <i>rủi ro kinh doanh</i> (nội tại và bên ngoài) và <i>rủi ro tài chính</i> (cấu trúc vốn). Bấm vào từng nút của cây để mở.</p>','<p><b>Systematic</b> risk stems from macro factors such as war, inflation, economic and political events. It includes <i>market risk</i> (how investors perceive share value; panic produces cascading sell-offs as in 2001–2003 and since 2008) and <i>interest-rate risk</i>.</p><p><b>Unsystematic</b> risk arises from labour, management capability, legal disputes and regulatory policy, and can be reduced through a diversified portfolio. It includes <i>business risk</i> (internal and external) and <i>financial risk</i> (capital structure). Click each node of the tree to expand.</p>'),
 P('Hai nhánh lớn, bốn loại rủi ro cụ thể; chỉ nhánh phi hệ thống mới đa dạng hóa được.','Two big branches, four specific risks; only the unsystematic branch can be diversified.'),null,[8,9]);
st(2,'rate','sr',null,P('Rủi ro lãi suất','Interest-rate risk'),P('Lãi suất tăng thì cổ phiếu chịu tác động qua đâu?','Through which channels does a rate rise hit stocks?'),P('Hai đường truyền của lãi suất','Two transmission channels of interest rates'),
 P('<p>Khi lãi suất tăng, TTCK chịu hai tác động. <b>Di chuyển vốn:</b> lãi suất huy động cao kéo nhà đầu tư về hình thức an toàn như gửi tiết kiệm thay vì cổ phiếu. <b>Tăng chi phí vay:</b> ngân hàng nâng lãi suất cho vay để bù huy động; doanh nghiệp đang phát triển phụ thuộc vốn vay (vì nguồn tài trợ qua TTCK còn hạn chế) nên chi phí vốn và rủi ro tài chính tăng.</p><p>Biến động đột ngột của lãi suất có thể kéo giá chứng khoán giảm liên tục. Hình cho thấy hai nhánh cùng dẫn đến một điểm: giá cổ phiếu giảm.</p>','<p>When rates rise the stock market takes two blows. <b>Capital shifts:</b> high deposit rates pull investors to safe forms such as savings instead of stocks. <b>Higher borrowing cost:</b> banks lift lending rates to cover funding cost; growing firms depend on bank loans (market funding is limited), so cost of capital and financial risk rise.</p><p>Sudden rate moves can push securities prices down persistently. The diagram shows both branches ending at the same point: lower share prices.</p>'),
 P('Lãi suất làm giảm cả cầu về cổ phiếu lẫn lợi nhuận kỳ vọng của doanh nghiệp.','Rates reduce both the demand for stocks and firms’ expected earnings.'),null,[9]);
st(2,'lev','full','r',P('Rủi ro tài chính','Financial risk'),P('Vay nợ làm thay đổi gì đối với cổ đông?','What does borrowing change for shareholders?'),P('Đòn bẩy khuếch đại biến động lợi nhuận','Leverage amplifies profit swings'),
 P('<p><b>Rủi ro kinh doanh</b> là các yếu tố ảnh hưởng hiệu suất công ty, có thể giảm lợi nhuận và cổ tức; gồm rủi ro nội tại (vận hành, quản trị) và rủi ro bên ngoài (chi phí vay, ngân sách chính phủ, thuế nhập khẩu, suy thoái).</p><p><b>Rủi ro tài chính</b> gắn với cách công ty huy động vốn. Nợ tạo nghĩa vụ trả lãi trước khi chia cổ tức, nên làm lợi suất của cổ đông biến động mạnh hơn. Minh họa: kéo tỷ lệ nợ để thấy cùng một mức dao động của lợi nhuận hoạt động tạo ra dải lợi suất vốn chủ rộng hơn nhiều. Công ty không vay nợ thì không có rủi ro tài chính.</p>','<p><b>Business risk</b> covers factors affecting company performance that can cut profit and dividends: internal (operations, governance) and external (borrowing cost, government budget, import tariffs, recession).</p><p><b>Financial risk</b> comes from how a firm raises capital. Debt creates interest obligations paid before dividends, making shareholder returns swing harder. Illustration: drag the debt ratio and see the same swing in operating profit produce a much wider band of return on equity. A debt-free firm carries no financial risk.</p>'),
 P('Nợ không đổi giá trị trung bình nhiều, nhưng nới rộng dải biến động của cổ đông.','Debt barely moves the average but widens the shareholders’ band of outcomes.'),
 String.raw`$$\text{ROE}=\frac{(\text{EBIT}-iD)(1-t)}{E},\qquad E=A-D$$`,[]);
st(2,'bankrole','sl',null,P('Ngân hàng thương mại','Commercial banks'),P('Ngân hàng làm gì trong nền kinh tế?','What do banks do in the economy?'),P('Trung gian giữa tiết kiệm và đầu tư','The intermediary between saving and investment'),
 P('<p>Ngân hàng thương mại là tổ chức kinh doanh tiền tệ, nhận tiền gửi rồi cho vay và đầu tư vào tài sản sinh lợi, kết nối khu vực tiết kiệm với khu vực đầu tư. Năm vai trò chính: chuyển tiết kiệm của hộ gia đình thành tín dụng cho doanh nghiệp và cá nhân (vốn lưu động, trung và dài hạn); thực hiện thanh toán thay khách hàng (séc, mạng lưới điện tử); cam kết trả nợ thay khách khi họ mất khả năng; quản lý, bảo lãnh phát hành hoặc thu hồi chứng khoán; và là công cụ thực hiện chính sách vĩ mô của Chính phủ.</p>','<p>A commercial bank is a money-dealing institution that takes deposits then lends and invests in yield-bearing assets, linking savers with investors. Five main roles: turn household savings into credit for firms and individuals (working capital, medium and long term); make payments for clients (cheques, electronic networks); guarantee repayment on behalf of clients who cannot pay; manage and underwrite issuance or redemption of securities; and serve as a tool for implementing the Government’s macro policy.</p>'),
 P('Ngân hàng là cái van của dòng vốn, nên rủi ro của nó cũng là rủi ro của cả nền kinh tế.','The bank is the valve of the capital flow, so its risk is the economy’s risk.'),null,[7,17]);
st(2,'net','sr',null,P('Mạng lưới hoạt động','Operating network'),P('Một ngân hàng được tổ chức thế nào?','How is a bank organised?'),P('Chi nhánh, phòng giao dịch và các đơn vị khác','Branches, transaction offices and other units'),
 P('<p>Theo Thông tư hợp nhất 08/VBHN-NHNN (2022), mạng lưới của ngân hàng thương mại gồm chi nhánh, phòng giao dịch, văn phòng đại diện, đơn vị sự nghiệp trong nước, và chi nhánh, văn phòng đại diện, ngân hàng 100% vốn ở nước ngoài.</p><p><b>Chi nhánh</b>: hạch toán phụ thuộc, có con dấu, thực hiện một hoặc một số chức năng. <b>Phòng giao dịch</b>: do một chi nhánh quản lý, hạch toán báo sổ, không được quyết định cấp tín dụng cho một khách hàng vượt 2 tỷ đồng (trừ khoản bảo đảm bằng tiền, thẻ tiết kiệm, giấy tờ có giá do chính ngân hàng phát hành, trái phiếu chính phủ, tín phiếu kho bạc). <b>Văn phòng đại diện</b>: chỉ đại diện theo ủy quyền, không kinh doanh. <b>Ngân hàng 100% vốn nước ngoài</b>: công ty con 100% vốn do ngân hàng Việt Nam sở hữu, thành lập theo luật nước ngoài.</p>','<p>Under consolidated Circular 08/VBHN-NHNN (2022), a commercial bank’s network includes branches, transaction offices, representative offices, domestic non-business units, and overseas branches, representative offices and wholly-owned banks.</p><p><b>Branch</b>: dependent accounting, has a seal, performs one or several functions. <b>Transaction office</b>: managed by a branch, reports accounts upward, may not decide credit to one client above VND 2 bn (unless fully secured by cash, savings cards, the bank’s own valuable papers, government bonds or treasury bills). <b>Representative office</b>: acts only by authorisation, no business. <b>Wholly-owned foreign bank</b>: a 100%-owned subsidiary of a Vietnamese bank established under foreign law.</p>'),
 P('Quyền quyết định tín dụng giảm dần từ chi nhánh xuống phòng giao dịch.','Credit authority narrows from branch down to transaction office.'),null,[16]);
st(2,'sixrisk','full','l',P('Rủi ro ngân hàng','Bank risks'),P('Những rủi ro nào đè lên giá cổ phiếu ngân hàng?','Which risks weigh on bank share prices?'),P('Sáu rủi ro của một ngân hàng','Six risks of a bank'),
 P('<p><b>Lãi suất</b>: lệch kỳ hạn và thanh khoản giữa huy động và sử dụng vốn khi lãi suất đổi ngoài dự đoán. <b>Tín dụng</b>: khách vay không thực hiện nghĩa vụ; nặng nề khi kinh tế khó khăn kéo dài, nhất là bất động sản; ngân hàng trích lập dự phòng. <b>Ngoại hối</b>: tỷ giá biến động trên tài sản Có và Nợ ngoại tệ. <b>Thanh khoản</b>: không đáp ứng nhu cầu rút tiền hoặc nghĩa vụ tài chính do lệch quy mô, kỳ hạn tài sản nợ và có. <b>Hoạt động</b>: tổn thất do quy trình, con người, hệ thống nội bộ hay sự kiện bên ngoài. <b>Khác</b>: thiên tai, địch họa; giảm bằng bảo hiểm và trung tâm công nghệ dự phòng.</p><p>Bấm vào từng đỉnh lục giác để đọc cách ngân hàng giảm thiểu.</p>','<p><b>Interest rate</b>: maturity and liquidity mismatch between funding and uses when rates change unexpectedly. <b>Credit</b>: borrowers fail to meet obligations; severe when the economy struggles for long, especially in real estate; banks set aside provisions. <b>Foreign exchange</b>: rate moves on FX assets and liabilities. <b>Liquidity</b>: failing to meet withdrawals or financial obligations because of size and maturity mismatch. <b>Operational</b>: losses from processes, people, internal systems or external events. <b>Other</b>: natural disasters and war; mitigated by insurance and a back-up technology centre.</p><p>Click each vertex of the hexagon to read how banks mitigate it.</p>'),
 P('Sáu rủi ro, mỗi rủi ro có công cụ giảm thiểu riêng, nhưng cùng đổ về giá cổ phiếu.','Six risks, each with its own mitigant, all flowing into the share price.'),null,[7,17]);
st(2,'listing','bar',null,P('Niêm yết','Listing'),P('Những ngân hàng nào niêm yết, và từ khi nào?','Which banks listed, and when?'),P('Bảy ngân hàng niêm yết, từ 2006 đến 2018','Seven banks listed, 2006 to 2018'),
 P('<p>ACB niêm yết ở HNX, giao dịch từ 21/11/2006. STB niêm yết 02/06/2006 và giao dịch từ 12/07/2006 trên HOSE. VCB niêm yết 30/06/2009 và CTG 16/07/2009; MBB 01/11/2011; BID niêm yết 16/01/2014, giao dịch từ 24/01/2014; HDB ngày 05/01/2018, cùng trên HOSE.</p><p>Niêm yết đưa cổ phiếu ngân hàng vào các phép đo giá hằng ngày, đúng thứ ta cần cho một mô hình lợi suất.</p>','<p>ACB listed on HNX, trading from 21 Nov 2006. STB listed on 2 Jun 2006 and began trading on HOSE on 12 Jul 2006. VCB listed on 30 Jun 2009 and CTG on 16 Jul 2009; MBB on 1 Nov 2011; BID listed on 16 Jan 2014, trading from 24 Jan 2014; HDB on 5 Jan 2018, all on HOSE.</p><p>Listing puts bank stocks under daily price quotation, exactly what a return model needs.</p>'),
 P('Càng niêm yết sớm, càng có nhiều năm giá công khai để đo.','The earlier the listing, the more years of public prices to measure.'),null,[15,7]);
st(2,'fund','sl',null,P('Sự cần thiết niêm yết','Why list'),P('Niêm yết mang lại gì cho một ngân hàng?','What does listing give a bank?'),P('Huy động vốn, thanh khoản, uy tín','Capital, liquidity, credibility'),
 P('<p><b>Huy động vốn lớn khi cần.</b> Phát hành cổ phiếu mở rộng vốn và cơ sở cổ đông nhưng làm loãng quyền sở hữu và có thể gây áp lực giá. Phát hành trái phiếu cho vốn ổn định, dài hạn, không loãng sở hữu, nhưng phải trả lãi và gốc. Vay các tổ chức khác nhanh nhưng lãi cao và điều kiện chặt.</p><p><b>Nâng thanh khoản.</b> Cổ phiếu niêm yết dễ giao dịch, giá phản ánh đúng hơn hoạt động và triển vọng. <b>Tăng uy tín</b> với tổ chức tài chính nhờ kết quả kinh doanh ổn định, quản trị rủi ro tốt, công bố thông tin minh bạch và cam kết phát triển bền vững. Chọn phương án huy động để xem đánh đổi.</p>','<p><b>Raising large capital when needed.</b> Issuing shares widens capital and shareholder base but dilutes ownership and may pressure the price. Issuing bonds gives stable, long-term funds without dilution but needs interest and principal repaid. Borrowing from other institutions is fast but costly with strict conditions.</p><p><b>Higher liquidity.</b> Listed shares trade easily and prices reflect operations and prospects better. <b>More credibility</b> with financial institutions thanks to steady results, good risk management, transparent disclosure and a sustainability commitment. Pick a funding route to see the trade-offs.</p>'),
 P('Mỗi cách huy động đổi quyền sở hữu, chi phí và tốc độ theo một cách khác nhau.','Each funding route trades ownership, cost and speed differently.'),null,[7,15,17]);
st(2,'crisis','sr',null,P('Sau khủng hoảng 2008','After 2008'),P('Khủng hoảng toàn cầu đã để lại gì cho ngân hàng?','What did the global crisis leave in banks?'),P('Từ thanh khoản thắt chặt đến tái cấu trúc 2011','From tight liquidity to the 2011 restructuring'),
 P('<p>Năm 2008 khủng hoảng tài chính toàn cầu đánh nặng vào ngân hàng TMCP Việt Nam: thanh khoản khó khăn, nợ xấu tăng cao, tăng trưởng tín dụng và lợi nhuận giảm. Doanh nghiệp và cá nhân không trả được nợ đúng hạn, dòng tiền đứt đoạn, chi phí dự phòng tăng còn thu nhập lãi giảm.</p><p>Ngân hàng phản ứng bằng huy động vốn từ nhiều nguồn (cổ phiếu, trái phiếu, tăng vốn điều lệ), tăng dự phòng, giảm lãi suất cho lĩnh vực ưu tiên như nông nghiệp và xuất khẩu, rồi sáp nhập, hợp nhất. Đến 2011 Chính phủ triển khai tái cấu trúc, gồm sáp nhập và hợp nhất các ngân hàng yếu để nâng năng lực tài chính và quản trị rủi ro.</p>','<p>In 2008 the global financial crisis hit Vietnamese joint-stock banks hard: tight liquidity, soaring bad debt, falling credit growth and profit. Firms and individuals could not repay on time, cash flow broke, provisioning cost rose while interest income fell.</p><p>Banks responded by raising capital from several sources (shares, bonds, charter capital), increasing provisions, cutting rates for priority sectors such as agriculture and exports, then merging. By 2011 the Government launched restructuring, including mergers and consolidation of weak banks to raise financial capacity and risk governance.</p>'),
 P('Một cú sốc bên ngoài biến thành chuỗi phản ứng dây chuyền bên trong hệ thống ngân hàng.','An outside shock became a chain reaction inside the banking system.'),null,[17]);
st(2,'price','full','l',P('Giá cổ phiếu VN30 ngân hàng','Bank stock prices'),P('Cổ phiếu ngân hàng đã đi thế nào trong cơn sóng ấy?','How did bank stocks move through those waves?'),P('Mười hai ngân hàng, một thị trường','Twelve banks, one market'),
 P('<p>Sau khủng hoảng 2008, ngân hàng tái cấu trúc để ổn định giá và tăng trưởng; nổi bật là Vietcombank, Techcombank và VPBank. Khi Covid-19 bùng phát giá cổ phiếu giảm mạnh, rồi phục hồi nhờ biện pháp hỗ trợ của Chính phủ và Ngân hàng Nhà nước, và tiếp tục tăng nhờ tăng vốn và phát hành cổ phiếu mới. Năm 2024 nhóm cổ phiếu ngân hàng, với tỷ trọng vốn hóa lớn, giúp VN30-Index tăng 1,34% trong phiên sáng lên 1.307,21 điểm, vượt VN-Index (1,07%).</p><p>Hình vẽ lợi suất tích lũy từ dữ liệu của đề tài. Di chuột lên một đường để so với VN30 nét đứt.</p>','<p>After the 2008 crisis banks restructured to stabilise prices and growth; Vietcombank, Techcombank and VPBank stood out. When Covid-19 hit, prices fell sharply, then recovered thanks to Government and central-bank support, and kept rising on capital increases and new share issues. In 2024 bank stocks, with large capitalisation weight, lifted VN30-Index 1.34% in the morning session to 1,307.21, beating VN-Index (1.07%).</p><p>The chart draws cumulative returns from the study’s data. Hover a line to compare it with the dashed VN30.</p>'),
 P('Cổ phiếu ngân hàng chiếm tỷ trọng lớn trong VN30, nên chúng vừa là nguyên nhân vừa là kết quả của chỉ số.','Bank stocks hold a large weight in VN30, so they are both cause and result of the index.'),null,[18,3,4]);
st(2,'macro','sl',null,P('Vĩ mô tác động giá','Macro drivers'),P('Ngoài rủi ro riêng của ngân hàng còn có gì?','What besides banks’ own risks?'),P('Bốn biến vĩ mô đi vào giá cổ phiếu','Four macro variables entering share prices'),
 P('<p>Ngoài các rủi ro đã nêu, giá cổ phiếu ngân hàng còn chịu tác động gián tiếp của yếu tố vĩ mô: tăng trưởng GDP, lạm phát, tỷ giá hối đoái, cùng chính sách tài chính và tiền tệ. Đó chính là nguồn của phần rủi ro hệ thống mà SIM sẽ gom vào một chỉ số duy nhất, VN30.</p><p>Chạm vào từng biến để thấy kênh truyền dẫn tới lợi nhuận ngân hàng rồi tới giá.</p>','<p>Beyond the risks above, bank share prices are also hit indirectly by macro factors: GDP growth, inflation, exchange rates, and fiscal and monetary policy. These are the sources of the systematic risk that SIM will pool into one index, VN30.</p><p>Tap each variable to see its channel to bank profit and then to price.</p>'),
 P('Bốn biến vĩ mô là phía “thị trường” của phương trình; phần còn lại của ngân hàng là ε.','Four macro variables are the “market” side of the equation; the rest of each bank is ε.'),null,[2,9]);

/* ===== CHƯƠNG 3 ===== */
st(3,'data','bar',null,P('Dữ liệu mô hình','Model data'),P('Dữ liệu gồm những gì, và đã được làm sạch ra sao?','What does the data contain, and how was it cleaned?'),P('Mười hai ngân hàng, một chỉ số, hơn một nghìn phiên','Twelve banks, one index, over a thousand sessions'),
 P('<p>Dữ liệu gồm 12 cổ phiếu ngân hàng thương mại và chỉ số VN30, theo ngày, từ 03/01/2020 đến 19/07/2024: 1.134 quan sát lợi suất. Lợi suất đơn r<sub>t</sub> = P<sub>t</sub>/P<sub>t−1</sub> − 1.</p><p>Trong chuỗi giá có 24 ngày biến động vượt biên độ ±7% của HOSE (chấm đỏ trên dải). Đó là ngày điều chỉnh giá do chia cổ tức bằng cổ phiếu hay phát hành thêm, giá giảm cơ học chứ không mang thông tin rủi ro, nên được loại để tránh méo β; còn 1.111 phiên chung cho cả 13 chuỗi.</p>','<p>The data cover 12 commercial-bank stocks and the VN30 index, daily, from 3 Jan 2020 to 19 Jul 2024: 1,134 return observations. Simple return r<sub>t</sub> = P<sub>t</sub>/P<sub>t−1</sub> − 1.</p><p>The price series contain 24 days with moves beyond HOSE’s ±7% limit (red dots on the strip). These are price-adjustment days for stock dividends or new issues, mechanical drops that carry no risk information, so they are removed to avoid distorting β; 1,111 sessions remain, common to all 13 series.</p>'),
 P('Làm sạch trước khi đo: một ngày điều chỉnh giá có thể kéo cả β lẫn độ lệch chuẩn đi sai.','Clean before measuring: a single price-adjustment day can pull both β and the standard deviation astray.'),
 String.raw`$$r_{it}=\frac{P_{it}}{P_{i,t-1}}-1,\qquad |r_{it}|>7\%\ \Rightarrow\ \text{drop}\ \ (24)$$`,[]);
st(3,'adf','sr',null,P('Kiểm định tính dừng','Stationarity'),P('Chuỗi lợi suất có ổn định theo thời gian không?','Are return series stable over time?'),P('ADF: bác bỏ nghiệm đơn vị ở cả 13 chuỗi','ADF: unit root rejected for all 13 series'),
 P('<p>Giả thuyết H<sub>0</sub>: chuỗi lợi suất không dừng (có nghiệm đơn vị); H<sub>1</sub>: chuỗi dừng. Quy tắc: thống kê t nhỏ hơn giá trị tới hạn (hay p nhỏ hơn mức ý nghĩa) thì bác bỏ H<sub>0</sub>.</p><p>Cả 13 chuỗi có t từ −30,3 đến −35,0, xa hơn rất nhiều giá trị tới hạn 1% (khoảng −3,44), p &lt; 0,001. Vậy chuỗi lợi suất dừng, hồi quy trên chúng không bị rủi ro hồi quy giả. Mỗi que là một chuỗi, vạch đỏ là ngưỡng bác bỏ.</p>','<p>H<sub>0</sub>: the return series is non-stationary (has a unit root); H<sub>1</sub>: it is stationary. Rule: a t-statistic below the critical value (or p below the significance level) rejects H<sub>0</sub>.</p><p>All 13 series have t between −30.3 and −35.0, far beyond the 1% critical value (about −3.44), p &lt; 0.001. So the return series are stationary and regressions on them avoid the spurious-regression trap. Each stick is one series, the red line is the rejection threshold.</p>'),
 P('Lợi suất là chuỗi dừng, nên có thể ước lượng mô hình trực tiếp trên chúng.','Returns are stationary, so the model can be estimated directly on them.'),
 String.raw`$$\Delta r_t=\mu+\gamma\,r_{t-1}+u_t,\qquad H_0:\gamma=0\ \ \text{vs}\ \ H_1:\gamma<0$$`,[21]);
st(3,'desc','full','l',P('Thống kê mô tả','Descriptive statistics'),P('Mỗi cổ phiếu có hình dạng lợi suất như thế nào?','What shape do each stock’s returns take?'),P('Trung bình, độ lệch chuẩn, độ lệch và độ nhọn','Mean, standard deviation, skewness and kurtosis'),
 P('<p>Đồ thị cho từng chuỗi: histogram của lợi suất ngày và đường chuẩn có cùng trung bình, độ lệch chuẩn. Tất cả đều nhọn hơn và đuôi dày hơn phân phối chuẩn: độ nhọn (kurtosis) từ 3,9 đến 6,4, so với mốc 3 của phân phối chuẩn. Độ lệch phần lớn âm nhẹ, VN30 là −0,77: các phiên giảm mạnh xảy ra nhiều hơn các phiên tăng mạnh tương ứng.</p><p>Về lợi suất bình quân quy năm, VIB cao nhất (khoảng 38,7%) còn VCB thấp nhất trong 12 mã (khoảng 13,1%). Về độ biến động, VCB cũng thấp nhất (1,67% mỗi ngày) và STB cao nhất (2,61%).</p>','<p>The chart shows, for each series, a histogram of daily returns with a normal curve of the same mean and standard deviation. All are more peaked with fatter tails than the normal: kurtosis between 3.9 and 6.4 against the normal’s 3. Skewness is mostly mildly negative, −0.77 for VN30: sharp down sessions outnumber matching sharp up sessions.</p><p>By annualised mean return VIB is highest (about 38.7%) and VCB lowest of the 12 (about 13.1%). By volatility VCB is also lowest (1.67% a day) and STB highest (2.61%).</p>'),
 P('Đuôi dày nghĩa là phiên cực đoan xuất hiện nhiều hơn mô hình chuẩn dự đoán.','Fat tails mean extreme sessions occur more often than a normal model predicts.'),
 String.raw`$$\text{Skew}=\frac{1}{n}\sum\left(\tfrac{r_t-\bar r}{\hat\sigma}\right)^3,\qquad \text{Kurt}=\frac{1}{n}\sum\left(\tfrac{r_t-\bar r}{\hat\sigma}\right)^4$$`,[]);
st(3,'jb','sl',null,P('Kiểm định phân phối chuẩn','Normality'),P('Lợi suất có tuân theo phân phối chuẩn không?','Do returns follow a normal distribution?'),P('Jarque–Bera: bác bỏ tính chuẩn ở mọi chuỗi','Jarque–Bera: normality rejected everywhere'),
 P('<p>H<sub>0</sub>: chuỗi lợi suất tuân theo phân phối chuẩn; H<sub>1</sub>: không chuẩn. Thống kê JB tăng khi độ lệch khác 0 và độ nhọn khác 3, và dưới H<sub>0</sub> xấp xỉ χ² với 2 bậc tự do (ngưỡng 5% là 5,99, ngưỡng 1% là 9,21).</p><p>JB của các ngân hàng nằm giữa 38 (STB) và 343 (VCB); VN30 là 641, đều vượt xa ngưỡng với p &lt; 0,001. Nên bác bỏ H<sub>0</sub>: không chuỗi nào chuẩn. Đồ thị Q–Q bên cạnh cho thấy hai đầu cong ra khỏi đường thẳng, đúng dấu hiệu của đuôi dày. Hệ quả: ước lượng điểm của OLS vẫn dùng được, nhưng suy luận nên dựa trên sai số chuẩn bền vững (kiểu GMM/HAC).</p>','<p>H<sub>0</sub>: returns follow a normal distribution; H<sub>1</sub>: they do not. The JB statistic grows when skewness departs from 0 and kurtosis from 3, and under H<sub>0</sub> is approximately χ² with 2 degrees of freedom (5% threshold 5.99, 1% threshold 9.21).</p><p>Banks’ JB runs from 38 (STB) to 343 (VCB); VN30 is 641, all far above the threshold with p &lt; 0.001. So H<sub>0</sub> is rejected: no series is normal. The Q–Q plot beside shows both ends bending off the line, the signature of fat tails. Consequence: OLS point estimates remain usable, but inference should rest on robust (GMM/HAC-type) standard errors.</p>'),
 P('Không chuỗi nào chuẩn; điều đó là lý do để dùng sai số chuẩn bền vững bên cạnh OLS.','No series is normal, which is the reason to pair OLS with robust standard errors.'),
 String.raw`$$JB=\frac{n}{6}\left[\text{Skew}^2+\frac{(\text{Kurt}-3)^2}{4}\right]\ \sim\ \chi^2_2\ \ (H_0)$$`,[22]);
st(3,'betas','full','r',P('Ước lượng SIM bằng OLS','SIM by OLS'),P('Mỗi ngân hàng nhạy với VN30 đến mức nào?','How sensitive is each bank to VN30?'),P('Hệ số β của mười hai ngân hàng','The β of the twelve banks'),
 P('<p>Mỗi ngân hàng được hồi quy lợi suất theo lợi suất VN30: r<sub>i</sub> = α + β·r<sub>VN30</sub> + ε. Tất cả β đều có ý nghĩa thống kê rất cao (t từ 11,5 đến 52,2; với sai số bền vững HAC vẫn từ 7,6 trở lên). Các hệ số α gần bằng 0, và chỉ MBB và VIB có ý nghĩa ở mức 5%.</p><p>Tám ngân hàng có β &gt; 1 (khuếch đại thị trường), cao nhất là STB 1,39, rồi TCB 1,30, MBB 1,25. Bốn ngân hàng có β &lt; 1: VIB 0,84, ACB 0,78, VCB 0,74 và thấp nhất EIB 0,57. Thanh ngang là khoảng tin cậy 95% của β.</p>','<p>Each bank’s return is regressed on the VN30 return: r<sub>i</sub> = α + β·r<sub>VN30</sub> + ε. All β are highly significant (t from 11.5 to 52.2; with HAC robust errors still 7.6 or above). The α coefficients are close to 0, and only MBB and VIB are significant at 5%.</p><p>Eight banks have β &gt; 1 (they amplify the market), highest STB 1.39, then TCB 1.30, MBB 1.25. Four have β &lt; 1: VIB 0.84, ACB 0.78, VCB 0.74 and lowest EIB 0.57. The horizontal bar is the 95% confidence interval of β.</p>'),
 P('β lớn hơn 1 thì ngân hàng đi mạnh hơn thị trường cả lúc lên lẫn lúc xuống.','A β above 1 means the bank moves harder than the market both up and down.'),
 String.raw`$$\hat\beta_i=\frac{\widehat{\operatorname{Cov}}(r_i,r_{VN30})}{\widehat{\operatorname{Var}}(r_{VN30})},\qquad \hat\alpha_i=\bar r_i-\hat\beta_i\,\bar r_{VN30}$$`,[20,24]);
st(3,'smalls','full','l',P('Mười hai đường hồi quy','Twelve regressions'),P('Đám mây lợi suất quanh đường hồi quy trông ra sao?','What does the return cloud around each line look like?'),P('Độ dốc là β, độ rộng của đám mây là rủi ro riêng','Slope is β, cloud width is own risk'),
 P('<p>Mỗi ô là một ngân hàng với 1.111 phiên: trục ngang là lợi suất VN30, trục dọc là lợi suất ngân hàng. Đường trắng là OLS. Độ dốc đường trắng chính là β; độ tản của chấm quanh đường là ε, tức rủi ro phi hệ thống.</p><p>So MBB, đám mây hẹp và dốc, với EIB, đám mây rộng và thoải: cùng một thị trường nhưng MBB đi theo thị trường gần như trọn vẹn (R² = 0,71), còn EIB phần lớn đi theo câu chuyện riêng (R² = 0,11).</p>','<p>Each panel is one bank over 1,111 sessions: horizontal axis VN30 return, vertical axis the bank’s return. The white line is OLS. Its slope is β; the scatter around it is ε, the unsystematic risk.</p><p>Compare MBB, a narrow steep cloud, with EIB, a wide shallow cloud: same market, but MBB follows it almost entirely (R² = 0.71) while EIB mostly follows its own story (R² = 0.11).</p>'),
 P('Cùng một dốc, đám mây hẹp hay rộng cho biết rủi ro riêng ít hay nhiều.','At the same slope, a narrow or wide cloud tells how little or how much own risk.'),null,[20]);
st(3,'cmat','sr',null,P('Ma trận tương quan','Correlation matrix'),P('Các ngân hàng liên hệ với nhau và với VN30 mạnh đến đâu?','How strongly are banks tied to each other and to VN30?'),P('Tương quan giữa mười hai ngân hàng và VN30','Correlation among twelve banks and VN30'),
 P('<p>Tương quan giữa các ngân hàng nằm từ 0,19 (EIB–VCB) đến 0,79 (MBB–TCB), trung bình 0,50; 36 trong 66 cặp lớn hơn 0,5 và chỉ 4 cặp vượt 0,7 (MBB–TCB, CTG–MBB, MBB–STB, BID–CTG). Tương quan với VN30 cao nhất ở MBB (0,84) và TCB (0,82), thấp nhất ở EIB (0,33).</p><p>Ngưỡng 0,7 của Anderson và cộng sự (1990) dùng để cảnh báo đa cộng tuyến giữa các biến độc lập; SIM chỉ có một biến độc lập là VN30, nên ở đây tương quan cao với VN30 không phải khuyết điểm mà là điều ta muốn: bình phương nó chính là R². Chọn một ngân hàng để xếp hàng theo tương quan với nó.</p>','<p>Correlations among banks run from 0.19 (EIB–VCB) to 0.79 (MBB–TCB), averaging 0.50; 36 of 66 pairs exceed 0.5 and only 4 exceed 0.7 (MBB–TCB, CTG–MBB, MBB–STB, BID–CTG). Correlation with VN30 is highest for MBB (0.84) and TCB (0.82), lowest for EIB (0.33).</p><p>The 0.7 threshold of Anderson et al. (1990) warns about multicollinearity among independent variables; SIM has a single independent variable, VN30, so a high correlation with VN30 is not a flaw but what we want: its square is exactly R². Pick a bank to sort the matrix by correlation with it.</p>'),
 P('Tương quan cao với VN30 nghĩa là R² cao, chứ không phải mô hình bị lỗi.','High correlation with VN30 means high R², not a broken model.'),
 String.raw`$$R_i^2=\rho_{i,VN30}^2$$`,[]);
st(3,'covm','sl',null,P('Ma trận hiệp phương sai','Covariance matrix'),P('SIM có tái tạo được cấu trúc hiệp phương sai không?','Does SIM reproduce the covariance structure?'),P('Hiệp phương sai thực, hiệp phương sai theo SIM và phần dư','Actual covariance, SIM-implied covariance and residuals'),
 P('<p>Các giá trị hiệp phương sai trông nhỏ (cỡ vài phần mười nghìn) chỉ vì lợi suất ngày là phân số của một; điều quan trọng là chúng so với phương sai ở đường chéo, mà tương quan đã chuẩn hóa giúp ta thấy. Đường chéo (phương sai) từ 2,8 đến 6,8 trên 10<sup>4</sup>, hiệp phương sai các cặp từ 0,8 đến 4,0.</p><p>SIM dự đoán hiệp phương sai giữa hai ngân hàng là β<sub>i</sub>β<sub>j</sub>σ<sub>m</sub>². Chuyển giữa ba chế độ xem: ma trận thực, ma trận do SIM tái tạo, và tương quan phần dư. Phần dư còn tương quan trung bình 0,10, cao nhất 0,36 (BID–CTG): giả thuyết (4) đúng gần đúng, và còn một nhân tố ngành ngân hàng nhỏ mà chỉ số VN30 chưa bắt hết.</p>','<p>Covariances look small (a few ten-thousandths) only because daily returns are fractions of one; what matters is their size against the variances on the diagonal, which normalised correlation makes visible. Diagonal variances range 2.8 to 6.8 per 10<sup>4</sup>, pair covariances 0.8 to 4.0.</p><p>SIM predicts the covariance between two banks as β<sub>i</sub>β<sub>j</sub>σ<sub>m</sub>². Switch between three views: the actual matrix, the SIM-implied matrix, and residual correlations. Residuals are still correlated at 0.10 on average, up to 0.36 (BID–CTG): assumption (4) holds approximately, and a small bank-sector factor remains that VN30 does not fully capture.</p>'),
 P('SIM tái tạo phần lớn cấu trúc; phần còn lại là tín hiệu ngành ngân hàng.','SIM recovers most of the structure; what is left is a banking-sector signal.'),
 String.raw`$$\widehat{\operatorname{Cov}}_{SIM}(r_i,r_j)=\hat\beta_i\hat\beta_j\hat\sigma_m^2\quad (i\ne j),\qquad \operatorname{Var}(r_i)=\hat\beta_i^2\hat\sigma_m^2+\hat\sigma_{\varepsilon_i}^2$$`,[20]);
st(3,'stack','full','r',P('Đo lường rủi ro','Risk measurement'),P('Rủi ro của mỗi ngân hàng đến từ thị trường bao nhiêu phần?','How much of each bank’s risk comes from the market?'),P('Tổng rủi ro, rủi ro hệ thống, rủi ro phi hệ thống','Total, systematic and unsystematic risk'),
 P('<p>Tổng rủi ro của ngân hàng i bằng phương sai lợi suất; nó tách thành rủi ro hệ thống β<sub>i</sub>²σ<sub>m</sub>² (từ chỉ số VN30) cộng rủi ro phi hệ thống σ<sub>ε</sub>². Mỗi cột là một ngân hàng, phần đặc là hệ thống, phần sọc là riêng; con số bên trên là R².</p><p>STB có tổng rủi ro cao nhất (6,80 trên 10<sup>4</sup>) và cũng là mã chịu rủi ro hệ thống lớn nhất (3,82), tiếp theo TCB và MBB. VCB có tổng rủi ro thấp nhất (2,80). EIB là mã riêng lẻ nhất: 89% rủi ro là phi hệ thống (R² chỉ 0,11); MBB là mã ít riêng lẻ nhất (R² = 0,71). Bấm tiêu đề để sắp xếp theo từng tiêu chí.</p>','<p>A bank’s total risk is its return variance; it splits into systematic risk β<sub>i</sub>²σ<sub>m</sub>² (from the VN30 index) plus unsystematic risk σ<sub>ε</sub>². Each bar is a bank: solid part is systematic, hatched part is own; the figure above is R².</p><p>STB has the highest total risk (6.80 per 10<sup>4</sup>) and also the largest systematic risk (3.82), followed by TCB and MBB. VCB has the lowest total risk (2.80). EIB is the most idiosyncratic: 89% of its risk is unsystematic (R² only 0.11); MBB is the least (R² = 0.71). Click the labels to sort by each criterion.</p>'),
 P('Trung bình thị trường giải thích khoảng 48% rủi ro của một cổ phiếu ngân hàng; phần còn lại là chuyện riêng của từng mã.','On average the market explains about 48% of a bank stock’s risk; the rest is each stock’s own affair.'),

st(3,'rr','sr',null,P('Rủi ro và lợi suất','Risk and return'),P('Nhận gì khi chịu mức rủi ro đó?','What do you get for bearing that risk?'),P('Bản đồ rủi ro – lợi suất của mười hai mã','Risk–return map of the twelve stocks'),
 P('<p>Đặt lợi suất bình quân quy năm lên trục dọc, độ biến động quy năm lên trục ngang, bán kính bong bóng theo R². VIB nằm cao nhất về lợi suất nhưng phần lớn rủi ro của nó là riêng. VCB nằm thấp nhất về cả rủi ro lẫn lợi suất: an toàn nhất trong mẫu, đánh đổi bằng lợi suất bình quân thấp nhất. STB và TCB ở phía rủi ro cao nhất.</p><p>Các mã nằm trên đường nối gốc với VN30 có tỷ lệ lợi suất trên rủi ro thấp hơn của chỉ số; mã nằm phía trên đường, như VIB, HDB, MBB, ACB, cho lợi suất trên mỗi đơn vị rủi ro cao hơn VN30 trong giai đoạn này (đây là mô tả quá khứ, không phải dự báo).</p>','<p>Annualised mean return is on the vertical axis, annualised volatility on the horizontal, bubble radius follows R². VIB sits highest in return but most of its risk is its own. VCB sits lowest in both risk and return: the safest in the sample, paid for with the lowest average return. STB and TCB lie on the highest-risk side.</p><p>Stocks on the line from origin through VN30 have a return-to-risk ratio equal to the index; stocks above it, like VIB, HDB, MBB, ACB, earned more return per unit of risk than VN30 in this period (a description of the past, not a forecast).</p>'),
 P('Rủi ro thấp và lợi suất thấp đi cùng nhau ở VCB; VIB nhận lợi suất cao nhưng với phần rủi ro riêng rất lớn.','Low risk and low return go together at VCB; VIB earns high return carrying a large idiosyncratic share.'),null,[]);
st(3,'seven','sl',null,P('Hàm ý và khuyến cáo','Implications'),P('Nhà đầu tư nên làm gì với những con số này?','What should an investor do with these numbers?'),P('Bảy khuyến cáo đối với nhà đầu tư','Seven recommendations for investors'),
 P('<p>Từ kết quả: VIB có lợi suất bình quân cao nhất, VCB thấp nhất; VCB có rủi ro thấp nhất, nên là nơi an toàn nhất trong nhóm dù lợi suất không cao. Phần lớn mã còn lại ở mức rủi ro trung bình, nên cân nhắc tùy điều kiện tài chính, kiến thức và khả năng nắm bắt cơ hội. Các thông số này không mô tả hết diễn biến thị trường.</p><p>Bảy khuyến cáo: hiểu rõ ngành ngân hàng (tài chính, mô hình kinh doanh, chất lượng tài sản, nợ xấu, lãi suất, cạnh tranh); phân tích ngành và chính sách vĩ mô; đa dạng hóa danh mục; đầu tư dài hạn; theo dõi và cập nhật thông tin; tham khảo chuyên gia; xác định rõ mục tiêu đầu tư. Đồng thời so sánh các chỉ số tài chính, và không đầu tư vượt khả năng tài chính của mình.</p>','<p>From the results: VIB has the highest average return, VCB the lowest; VCB has the lowest risk, so it is the safest in the group even if its return is not high. Most other stocks sit at medium risk, so choice depends on financial conditions, knowledge and ability to seize opportunities. These figures do not describe all market moves.</p><p>Seven recommendations: understand the banking industry (finances, business model, asset quality, bad debt, rates, competition); analyse the sector and macro policy; diversify the portfolio; invest long term; monitor and update information; consult experts; define the investment goal clearly. Also compare financial ratios, and never invest beyond one’s means.</p>'),
 P('Đa dạng hóa trong nhóm ngân hàng chỉ gỡ được phần rủi ro riêng; phần hệ thống vẫn còn.','Diversifying within banks removes only own risk; systematic risk stays.'),null,[]);
STEPS_B.push({ch:4,v:'end',m:'end',sd:'l',k:P('Kết luận','Conclusion'),q:P('',''),h:P('',''),ref:[],f:null,s:P('',''),t:P(
 '<h2 class="end-h serif">Kết luận</h2><p class="end-p">Đề tài đo rủi ro cổ phiếu mười hai ngân hàng TMCP vốn hóa lớn giai đoạn 2020 – 7/2024 bằng mô hình chỉ số đơn với chỉ số VN30, ước lượng OLS cùng sai số chuẩn bền vững.</p><div class="bento"><div class="c" style="--cc:#d98f10"><b>48%</b><span>rủi ro trung bình của một cổ phiếu ngân hàng đến từ thị trường (R² từ 0,11 ở EIB đến 0,71 ở MBB); phần còn lại là rủi ro riêng.</span></div><div class="c" style="--cc:#1d9f7a"><b>β: 0,57 → 1,39</b><span>tám ngân hàng khuếch đại VN30 (β &gt; 1), bốn ngân hàng làm dịu (VIB, ACB, VCB, EIB).</span></div><div class="c" style="--cc:#d4493f"><b>STB cao nhất · VCB thấp nhất</b><span>về tổng rủi ro; STB cũng chịu rủi ro hệ thống lớn nhất, EIB mang nhiều rủi ro riêng nhất.</span></div><div class="c" style="--cc:#5b6dd6"><b>Không chuẩn</b><span>JB bác bỏ phân phối chuẩn ở cả 13 chuỗi, nên suy luận dựa trên sai số chuẩn bền vững.</span></div><div class="c" style="--cc:#d98f10"><b>0,10</b><span>tương quan phần dư trung bình giữa các ngân hàng: còn một nhân tố ngành mà một chỉ số chưa bắt hết.</span></div><div class="c" style="--cc:#1d9f7a"><b>1.111 phiên</b><span>sau khi loại 24 ngày điều chỉnh giá vượt biên độ ±7%.</span></div></div><p class="end-p" style="margin-top:14px">Phù hợp với Phan Thị Mỹ Hạnh và Tống Lâm Vy (2019) cùng Vũ Thị Thúy Vân và Phan Trọng Nghĩa (2018): ngân hàng vốn hóa lớn và ROE cao thường rủi ro hơn; theo Simon Quan và Robert A. Eisenbeis (1997), ngân hàng vốn hóa lớn hoạt động hiệu quả và kiểm soát rủi ro tốt hơn. Giới hạn: VN30 gồm cả các ngân hàng được đo, và kết quả mô tả quá khứ 2020–2024.</p>',
 '<h2 class="end-h serif">Conclusion</h2><p class="end-p">The study measures the risk of twelve large-cap joint-stock bank stocks over 2020 – Jul 2024 with the single index model on VN30, estimated by OLS with robust standard errors.</p><div class="bento"><div class="c" style="--cc:#d98f10"><b>48%</b><span>of a bank stock’s risk comes from the market on average (R² from 0.11 at EIB to 0.71 at MBB); the rest is own risk.</span></div><div class="c" style="--cc:#1d9f7a"><b>β: 0.57 → 1.39</b><span>eight banks amplify VN30 (β &gt; 1), four dampen it (VIB, ACB, VCB, EIB).</span></div><div class="c" style="--cc:#d4493f"><b>STB highest · VCB lowest</b><span>in total risk; STB also bears the largest systematic risk, EIB the most idiosyncratic.</span></div><div class="c" style="--cc:#5b6dd6"><b>Not normal</b><span>JB rejects normality for all 13 series, so inference rests on robust standard errors.</span></div><div class="c" style="--cc:#d98f10"><b>0.10</b><span>average residual correlation between banks: a sector factor remains that one index does not fully capture.</span></div><div class="c" style="--cc:#1d9f7a"><b>1,111 sessions</b><span>after removing 24 price-adjustment days beyond the ±7% limit.</span></div></div><p class="end-p" style="margin-top:14px">Consistent with Phan Thi My Hanh and Tong Lam Vy (2019) and Vu Thi Thuy Van and Phan Trong Nghia (2018): large-cap, high-ROE banks tend to be riskier; per Simon Quan and Robert A. Eisenbeis (1997), large-cap banks operate more efficiently and control risk better. Limits: VN30 contains the banks being measured, and results describe the 2020–2024 past.</p>')});

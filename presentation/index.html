<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rủi ro hệ thống của cổ phiếu ngân hàng Việt Nam · Bản trình bày</title><meta name="description" content="Mô hình chỉ số đơn cho 12 cổ phiếu ngân hàng so với VN30, 2020–2024: beta, kiểm định phần dư, danh mục EGP ngoài mẫu."><style>:root{--bg:#f5f0e6;--bg2:#ece5d4;--ink:#1a1a17;--mut:#6b665a;--card:#fffaf0;--line:#d9d1bf;--pap:#d6401f;--cor:#1f55d0;--amb:#c98a00;--grn:#158a5a;--pur:#7a4fc0;--acc:var(--cor);--hdr:56px}
:root[data-theme=dark]{--bg:#121316;--bg2:#17181c;--ink:#ece8dc;--mut:#9a958a;--card:#1b1c20;--line:#2c2d33;--pap:#ff6a4a;--cor:#6b97ff;--amb:#f2b92a;--grn:#3fcf95;--pur:#b08cff}
*{box-sizing:border-box}html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,"Noto Sans","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.hd{position:fixed;inset:0 0 auto 0;height:var(--hdr);z-index:50;display:flex;align-items:center;gap:14px;padding:0 clamp(12px,2.4vw,28px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd b{font-size:13px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.acts{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
.acts i{flex:1;min-width:0;height:26px;display:flex;align-items:center;justify-content:center;font:600 11px/1 inherit;font-style:normal;color:var(--mut);border-radius:13px;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;transition:.25s}
.acts i.on{color:var(--ink);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.bt{font:600 12px/1 inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer}
.bt:hover,.bt[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
.pg{position:fixed;left:0;top:var(--hdr);height:3px;background:var(--acc);z-index:51;width:0}
.sc{position:relative}
.st{position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));height:calc(100dvh - var(--hdr));overflow:hidden;display:grid;gap:clamp(12px,2.4vw,40px);padding:clamp(10px,2.2vh,28px) clamp(14px,3vw,48px);align-items:center;background:radial-gradient(1200px 600px at 85% 10%,color-mix(in srgb,var(--acc) 9%,transparent),transparent 60%)}
.st.L{grid-template-columns:minmax(260px,.82fr) minmax(0,1.5fr)}
.st.R{grid-template-columns:minmax(0,1.5fr) minmax(260px,.82fr)}.st.R .tx{order:2}
.st.B{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);align-items:start;gap:6px}.st.B .stw{height:clamp(60px,11vh,100px)}.st.B .tx h2{font-size:clamp(20px,2.4vw,32px);margin-bottom:8px}.st.B .stp{max-width:92ch}
.st.F{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);align-items:start}.st.F0{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}.st.F .vz{align-items:flex-start}
.tx{position:relative;align-self:center;min-height:0}
.ey{font:700 11px/1 inherit;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
.tx h2{font-size:clamp(24px,3.1vw,44px);line-height:1.08;letter-spacing:-.02em;margin:0 0 14px;font-weight:750}
.stp{position:absolute;left:0;right:0;top:100%;opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s;font-size:clamp(14px,1.28vw,18px);color:var(--ink);pointer-events:none;margin-top:0}
.stp.on{opacity:1;transform:none}
.stp em{font-style:normal;color:var(--acc);font-weight:700}
.stw{position:relative;height:clamp(110px,22vh,230px)}
.stw .stp{top:0}
.vz{position:relative;min-width:0;min-height:0;height:100%;display:flex;align-items:center;justify-content:center}
.vz svg{width:100%;height:100%;max-height:calc(100dvh - var(--hdr) - 40px);display:block}
.tech{margin-top:16px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;font-size:13px;color:var(--mut);display:none}
body.tc .tech{display:block}
math{font-size:1.1em;color:var(--ink)}
text{font-family:inherit}
.cap{font-size:12px;color:var(--mut);margin-top:8px}
/* cover */
.cv{width:100%;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:18px;height:100%;position:relative}
.cv h1{font-size:clamp(34px,6.4vw,96px);line-height:.98;letter-spacing:-.035em;margin:0;font-weight:800;max-width:15ch}
.cv h1 u{text-decoration:none;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--pap) 40%,transparent) 62%)}
.cv p{max-width:56ch;font-size:clamp(15px,1.5vw,21px);color:var(--mut);margin:0}
.mq{max-width:none;overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);padding:9px 0;margin-inline:calc(-1*clamp(14px,3vw,48px))}
.mq span{display:inline-block;animation:mq 40s linear infinite;padding-left:0}
.mq.r span{animation-direction:reverse;animation-duration:52s}
.mq i{font-style:normal;display:inline-flex;gap:8px;align-items:baseline;margin-right:34px;font-variant-numeric:tabular-nums}
.mq i b{font-size:13px;letter-spacing:.06em}.mq i s{text-decoration:none;color:var(--pap)}.mq i q{color:var(--cor);font-weight:700;quotes:none}
@keyframes mq{to{transform:translateX(-50%)}}
.kp{display:flex;gap:clamp(18px,4vw,56px);flex-wrap:wrap}.kp div b{display:block;font-size:clamp(28px,4vw,54px);letter-spacing:-.03em;line-height:1}.kp div span{font-size:12px;color:var(--mut)}
.scr{position:absolute;bottom:0;right:0;font-size:12px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
/* cards */
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;height:100%;max-height:calc(100dvh - var(--hdr) - 60px);align-content:center}
.fc{perspective:700px;height:clamp(84px,17vh,150px)}
.fc>div{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.fc .a,.fc .b{position:absolute;inset:0;border:1px solid var(--line);border-radius:12px;background:var(--card);backface-visibility:hidden;padding:10px 12px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.fc .b{transform:rotateY(180deg);font-size:12px;border-color:var(--cor)}
.fc b.t{font-size:15px;letter-spacing:.06em}.fc .n{font-size:11px;color:var(--mut)}
.fc .big{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}
/* receipt */
.rc{width:min(100%,640px);margin:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(12px,2vh,22px);font-variant-numeric:tabular-nums}
.rc .rw{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:clamp(12px,1.3vw,15px);opacity:0;transform:translateY(8px);transition:.35s}
.rc .rw.on{opacity:1;transform:none}.rc .rw:first-child{font-weight:700;color:var(--mut);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.rc .rw .p{color:var(--pap);font-weight:700}.rc .rw .c{color:var(--cor);font-weight:700}
.ab{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.ab span{font-size:clamp(10px,1vw,12px);padding:5px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);opacity:0;transform:scale(.9);transition:.3s;text-align:center;white-space:nowrap}
.ab span.on{opacity:1;transform:none}.ab b{color:var(--pap)}
/* close */
.cl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.cl>div{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;opacity:0;transform:translateY(14px);transition:.5s}.cl>div.on{opacity:1;transform:none}
.cl h3{margin:0 0 6px;font-size:16px;color:var(--acc)}.cl p{margin:0;font-size:14px;color:var(--ink)}
.ref{font-size:12px;color:var(--mut);margin-top:14px;max-width:90ch}
.ref a{color:var(--cor)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media(max-width:860px){
.st.L,.st.R{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);align-items:start;gap:8px}.st.R .tx{order:0}

.acts i:not(.on){display:none}.hd b{display:none}
.fg{grid-template-columns:repeat(3,1fr)}.fc{height:clamp(70px,12vh,110px)}
.cl{grid-template-columns:1fr}.ab{grid-template-columns:repeat(3,1fr)}
.cv h1{font-size:40px}
}

['Sharpe ngoài mẫu: EGP 0,55, chia đều 0,89, VN30 0,98. Khoảng tin cậy 95% của chênh lệch (EGP − chia đều) là [−1,16; 0,51], chứa 0: không có bằng chứng tối ưu hóa tạo thêm giá trị.','Out-of-sample Sharpe: EGP 0.55, equal weight 0.89, VN30 0.98. The 95% interval of the difference (EGP − equal weight) is [−1.16, 0.51], containing 0: no evidence that optimising adds value.']],

 const sc=D.egp,cards=[[L('EGP','EGP'),sc.egp_sharpe,'var(--pur)'],[L('Chia đều','Equal wt'),sc.ew_sharpe,'var(--amb)'],['VN30',sc.vn30_sharpe,'var(--cor)']];

 return `<svg viewBox="0 0 ${W} ${H}"><rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="none" stroke="var(--line)"/>
 <line x1="${x0}" y1="${Y(1)}" x2="${x1}" y2="${Y(1)}" stroke="var(--line)" stroke-dasharray="4 4"/>
 <path d="${path(q.m)}" fill="none" stroke="var(--cor)" stroke-width="2.4"/><path d="${path(q.ew)}" fill="none" stroke="var(--amb)" stroke-width="2.4"/><path d="${path(q.egp)}" fill="none" stroke="var(--pur)" stroke-width="3.2"/>
 <text x="${x0+8}" y="${y0+18}" font-size="12" fill="var(--mut)">${L('Giá trị 1 đồng đầu tư, 03/01/2023 → 18/07/2024','Value of 1 invested, 3 Jan 2023 → 18 Jul 2024')}</text>
 <text x="${x1-8}" y="${y0+18}" text-anchor="end" font-size="13" font-weight="800" fill="var(--pur)">EGP ${f(q.egp[k])} · ${L("chia đều","EW")} ${f(q.ew[k])} · VN30 ${f(q.m[k])}</text><g opacity="${ap}">${c}</g>
 <g opacity="${ap}"><text x="${x0+110}" y="${ciy-12}" font-size="11" fill="var(--mut)">${L('Khoảng tin cậy 95% của chênh lệch Sharpe (EGP − chia đều)','95% CI of the Sharpe difference (EGP − equal weight)')}</text>
 <line x1="${cx(-1.4)}" y1="${ciy+10}" x2="${cx(1)}" y2="${ciy+10}" stroke="var(--line)"/><line x1="${cx(0)}" y1="${ciy}" x2="${cx(0)}" y2="${ciy+20}" stroke="var(--ink)" stroke-width="2"/>
 <line x1="${cx(sc.sharpe_diff_ci[0])}" y1="${ciy+10}" x2="${cx(sc.sharpe_diff_ci[1])}" y2="${ciy+10}" stroke="var(--pap)" stroke-width="8" stroke-linecap="round"/>
 <text x="${cx(sc.sharpe_diff_ci[0])}" y="${ciy+38}" text-anchor="middle" font-size="11" fill="var(--pap)">${f(sc.sharpe_diff_ci[0])}</text><text x="${cx(sc.sharpe_diff_ci[1])}" y="${ciy+38}" text-anchor="middle" font-size="11" fill="var(--pap)">${f(sc.sharpe_diff_ci[1])}</text><text x="${cx(0)}" y="${ciy+38}" text-anchor="middle" font-size="11" fill="var(--ink)">0</text></g></svg>`;}});

 const h=el.dataset.l!==LANG;if(h){el.dataset.l=LANG;el.innerHTML=`<div style="width:100%"><div class="cl">${it.map(c=>`<div><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div><p class="ref">${L('Phân tích học thuật, không phải khuyến nghị đầu tư. Dữ liệu và mã: ','Academic analysis, not investment advice. Data and code: ')}<a href="https://github.com/lenguyenquocthang/single-index-model-vn-banks">GitHub</a> · <a href="../report/">${L('Báo cáo','Report')}</a>. ${L('Phương pháp: OLS với sai số HAC (Newey–West), Dimson/Blume, kiểm định Breusch–Pagan LM, EGP với bootstrap theo khối. Phụ lục của báo cáo đối chiếu số liệu với nghiên cứu gốc.','Methods: OLS with HAC (Newey–West) errors, Dimson/Blume adjustments, Breusch–Pagan LM test, EGP with block bootstrap. The “Data reconciliation” section of the report lists every difference between the source paper and the recomputation.')}</p></div>`}

const HDR=56;const root=document.getElementById('app');
const hd=document.getElementById('hd');

const secs=SC.map(s=>{

 sec.innerHTML=`<div class="st ${s.h2?s.lay:'F0'}">${s.h2?'<div class="tx"><div class="ey"></div><h2></h2><div class="stw"></div><div class="tech"></div></div>':''}<div class="vz"></div></div>`;

function text(){
 document.documentElement.lang=LANG;
 document.getElementById('br').textContent=L('Beta ngân hàng · VN30','Bank betas · VN30');
 document.getElementById('bTc').textContent=L('Kỹ thuật','Technical');document.getElementById('bLg').textContent=LANG==='vi'?'EN':'VI';
 document.getElementById('acts').innerHTML=ACTS.map((a,i)=>`<i data-i="${i}" style="--c:var(${a[2]})">${L(a[0],a[1])}</i>`).join('');
 document.title=L('Rủi ro hệ thống của cổ phiếu ngân hàng Việt Nam · Bản trình bày','Systematic risk of Vietnamese bank stocks · Presentation');
 secs.forEach(o=>{const s=o.s;if(!o.tx)return;
  o.tx.querySelector('.ey').textContent=L(s.ey[0],s.ey[1]);o.tx.querySelector('h2').textContent=L(s.h2[0],s.h2[1]);
  o.tx.querySelector('.stw').innerHTML=s.steps.map(t=>`<div class="stp">${L(t[0],t[1])}</div>`).join('');
  o.tx.querySelector('.tech').innerHTML=s.tech?s.tech():'';o.last='';});
}
text();
let act=-1;
function frame(){
 const stH=innerHeight-HDR;let a=0;
 secs.forEach((o,i)=>{
  const r=o.sec.getBoundingClientRect();
  if(r.top<=HDR+stH*.5)a=o.s.act;
  if(r.bottom<HDR-80||r.top>innerHeight+80)return;
  const p=clamp((HDR-r.top)/Math.max(1,r.height-stH));
  const s=o.s;
  if(s.draw){const h=s.draw(p);if(h!==o.last){o.vz.innerHTML=h;o.last=h}}else if(s.upd)s.upd(o.vz,p);
  if(o.tx){const st=o.tx.querySelectorAll('.stp');const k=Math.min(st.length-1,Math.floor(p*st.length));st.forEach((e,j)=>e.classList.toggle('on',j===k))}
 });
 if(a!==act){act=a;document.documentElement.style.setProperty('--acc',`var(${ACTS[a][2]})`);document.querySelectorAll('#acts i').forEach((e,i)=>e.classList.toggle('on',i===a))}
 const h=document.documentElement.scrollHeight-innerHeight;document.getElementById('pg').style.width=(h>0?scrollY/h*100:0)+'%';
}
let tk=0;const req=()=>{if(!tk)tk=requestAnimationFrame(()=>{tk=0;frame()})};
addEventListener('scroll',req,{passive:true});addEventListener('resize',req);
document.getElementById('bLg').onclick=()=>{LANG=LANG==='vi'?'en':'vi';text();frame()};
document.getElementById('bTc').onclick=e=>{const on=document.body.classList.toggle('tc');e.currentTarget.setAttribute('aria-pressed',on)};
document.getElementById('bTh').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';frame()};
document.getElementById('acts').onclick=e=>{const i=+e.target.dataset.i;if(isNaN(i))return;const o=secs.find(o=>o.s.act===i);if(o)scrollTo({top:o.sec.offsetTop+2,behavior:'smooth'})};
if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark';
frame();
